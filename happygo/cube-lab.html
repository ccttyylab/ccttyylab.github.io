</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>Cube Lab</span></div>
      <div class="status-pill"><span class="status-dot"></span>练习模式</div>
      <button type="button" class="drawer-btn" id="drawerBtn" aria-expanded="false">教程</button>
    </header>

    <section class="hero">
      <div>
        <p class="eyebrow">3 × 3 × 3 · SPEED TRAINING</p>
        <h1>掌控每一个转动</h1>
      </div>
    </section>

    <section class="workspace">
      <div class="steps-card">
        <div class="steps-card-head">
          <span>解法步骤</span>
          <span class="step-count" id="stepCount">0 / 0</span>
        </div>
        <div class="steps" id="steps">
          <div class="empty-state">点击「生成解法」按当前状态求解</div>
        </div>
      </div>
      <div class="cube-panel">
        <div class="panel-label">
          <span>当前状态</span>
          <div class="panel-tools">
            <button type="button" class="orient-btn" id="orientBtn" title="上黄下白">黄顶</button>
            <label class="lock-switch">
              <input type="checkbox" id="lockToggle" />
              <span class="lock-track" aria-hidden="true"></span>
              锁定
            </label>
            <span id="moveCount">0 步</span>
          </div>
        </div>
        <div class="cube-stage">
          <div class="cube" id="cube" aria-label="3D 魔方"></div>
        </div>
        <div class="controls">
          <div class="controls-row">
            <button class="primary" id="scrambleBtn">一键打乱</button>
            <button class="secondary" id="solveBtn">生成解法</button>
            <button class="icon-btn" id="resetBtn" title="新建魔方">＋</button>
          </div>
          <div class="controls-row">
            <button class="secondary wide" id="previousBtn" disabled>← 上一步</button>
            <button class="primary wide" id="nextBtn" disabled>下一步 →</button>
          </div>
          <div class="move-grid" id="moveGrid">
            <div class="move-pair">
              <button data-move="U">U</button><button data-move="U'">U′</button><button data-move="U2">U2</button>
            </div>
            <div class="move-pair">
              <button data-move="D">D</button><button data-move="D'">D′</button><button data-move="D2">D2</button>
            </div>
            <div class="move-pair">
              <button data-move="R">R</button><button data-move="R'">R′</button><button data-move="R2">R2</button>
            </div>
            <div class="move-pair">
              <button data-move="L">L</button><button data-move="L'">L′</button><button data-move="L2">L2</button>
            </div>
            <div class="move-pair">
              <button data-move="F">F</button><button data-move="F'">F′</button><button data-move="F2">F2</button>
            </div>
            <div class="move-pair">
              <button data-move="B">B</button><button data-move="B'">B′</button><button data-move="B2">B2</button>
            </div>
          </div>
        </div>
        <p class="tip">拖色块转层 · 双指旋转缩放 · 字母随朝向：U 顶 / F 正面 / R 右 · 滚轮缩放 · <kbd>U R F D L B</kbd> <kbd>Shift</kbd> 逆时针</p>
      </div>
      <aside class="side-col" id="guideDrawer">
        <button type="button" class="drawer-handle" id="drawerHandle" aria-label="关闭教程">
          <span class="drawer-grip"></span>
        </button>
        <div class="guide-card">
          <div class="guide-modes" id="guideModes"></div>
          <div class="guide-tabs" id="guideTabs"></div>
          <div class="guide-list" id="guideList"></div>
        </div>
        <div class="saves-card">
          <div class="steps-card-head">
            <span>存档</span>
            <span class="step-count" id="saveCount">0</span>
          </div>
          <div class="save-form">
            <input id="saveName" type="text" maxlength="32" placeholder="名称" autocomplete="off" />
            <button type="button" class="secondary" id="saveBtn">保存</button>
          </div>
          <div class="save-list" id="saveList"></div>
        </div>
      </aside>
    </section>

    <footer><span>© 2026 Cube Lab</span><span>three-rubiks-cube · CSS3D</span></footer>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
  </main>
</body>
</html>
