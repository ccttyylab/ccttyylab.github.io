<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>0-100 加减练习</title><script src="https://cdn.tailwindcss.com"></script><style>@import url(https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+SC:wght@400;700&display=swap);body{font-family:'Noto Sans SC',sans-serif;background:linear-gradient(135deg,#e0f2fe 0,#fef3c7 100%);user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.font-cartoon{font-family:'Fredoka One','Noto Sans SC',cursive}@keyframes pop-success{0%{transform:scale(.5);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}@keyframes shake-error{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}.animate-pop{animation:pop-success .4s cubic-bezier(.175,.885,.32,1.275)}.animate-shake{animation:shake-error .4s ease-in-out}.btn-cartoon{transition:all .1s;box-shadow:0 6px 0 rgba(0,0,0,.15)}.btn-cartoon:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}.glass-card{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border:4px solid rgba(255,255,255,.6);border-radius:24px;box-shadow:0 10px 25px -5px rgba(0,0,0,.1)}.range-btn{background:#fff;border:3px solid #e5e7eb;color:#4b5563}.range-btn.selected{background:linear-gradient(135deg,#6366f1 0,#8b5cf6 100%);color:#fff;border-color:#4f46e5;box-shadow:0 4px 0 #4338ca}.option-btn.correct-answer{background:linear-gradient(135deg,#86efac 0,#4ade80 100%)!important;color:#fff;border-color:#bbf7d0}.option-btn.wrong-answer{background:linear-gradient(135deg,#fca5a5 0,#f87171 100%)!important;color:#fff;border-color:#fecaca}</style></head><body class="min-h-screen w-screen flex flex-col items-center justify-center p-4 py-8"><h1 class="text-4xl md:text-5xl font-cartoon text-indigo-600 drop-shadow-lg mb-6 text-center">0-100 加减练习</h1><div class="glass-card w-full max-w-md p-4 mb-6"><h3 class="text-lg font-bold text-gray-600 mb-3 text-center">选择数字范围</h3><div class="flex gap-4"><button onclick="setRange(20)" id="range-20" class="range-btn flex-1 py-4 rounded-2xl font-bold text-lg btn-cartoon selected">0 - 20</button> <button onclick="setRange(100)" id="range-100" class="range-btn flex-1 py-4 rounded-2xl font-bold text-lg btn-cartoon">0 - 100</button></div></div><div class="glass-card w-full max-w-md p-6 mb-6"><div id="question-text" class="text-5xl md:text-6xl font-cartoon text-gray-800 text-center mb-8">--</div><div id="options-container" class="grid grid-cols-3 gap-3"></div></div><div class="flex gap-6 text-gray-600 font-bold"><span>得分: <span id="score-display" class="text-indigo-600">0</span></span> <span>第 <span id="round-display">1</span> 题</span></div><button onclick="nextQuestion()" id="next-btn" class="mt-6 btn-cartoon py-3 px-8 rounded-2xl font-bold text-white bg-indigo-500 hover:bg-indigo-600 border-b-4 border-indigo-700 active:border-b-0 hidden">下一题</button><script>let state={maxRange:20,score:0,round:1,currentQuestion:null,isAnswering:!0};const elements={questionText:document.getElementById("question-text"),optionsContainer:document.getElementById("options-container"),scoreDisplay:document.getElementById("score-display"),roundDisplay:document.getElementById("round-display"),nextBtn:document.getElementById("next-btn"),range20:document.getElementById("range-20"),range100:document.getElementById("range-100")};function setRange(e){state.maxRange=e,state.score=0,state.round=1,state.isAnswering=!0,elements.range20.classList.toggle("selected",20===e),elements.range100.classList.toggle("selected",100===e),updateUI(),nextQuestion()}function generateQuestion(){const e=Math.random()>.5,t=state.maxRange;let n,o,s;e?(s=Math.floor(Math.random()*(t+1)),n=Math.floor(Math.random()*(s+1)),o=s-n):(n=Math.floor(Math.random()*(t+1)),o=Math.floor(Math.random()*(n+1)),s=n-o);return{num1:n,num2:o,operator:e?"+":"-",answer:s}}function generateOptions(e){const t=new Set([e]),n=state.maxRange,o=n<=20?5:15;for(;t.size<6;){const s=e+(Math.floor(Math.random()*o*2)-o||(Math.random()>.5?1:-1));s>=0&&s<=n&&!t.has(s)&&t.add(s)}return Array.from(t).sort(()=>Math.random()-.5)}function nextQuestion(){state.currentQuestion=generateQuestion();const{num1:e,num2:t,operator:n,answer:o}=state.currentQuestion;state.isAnswering=!0,elements.nextBtn.classList.add("hidden"),elements.questionText.textContent=`${e} ${n} ${t} = ?`;const s=generateOptions(o);elements.optionsContainer.innerHTML="",s.forEach(e=>{const t=document.createElement("button");t.className="option-btn btn-cartoon py-4 rounded-xl text-2xl font-bold text-gray-800 bg-cyan-100 hover:bg-cyan-200 border-2 border-white shadow-sm",t.textContent=e,t.onclick=()=>checkAnswer(e,t),elements.optionsContainer.appendChild(t)}),updateUI()}function checkAnswer(e,t){if(!state.isAnswering)return;e===state.currentQuestion.answer?(state.isAnswering=!1,state.score+=10,t.classList.add("correct-answer"),document.querySelectorAll(".option-btn").forEach(e=>e.onclick=null),elements.nextBtn.classList.remove("hidden"),updateUI()):(t.classList.add("wrong-answer","animate-shake"),setTimeout(()=>t.classList.remove("animate-shake"),400))}function updateUI(){elements.scoreDisplay.textContent=state.score,elements.roundDisplay.textContent=state.round}elements.nextBtn.onclick=()=>{state.round++,nextQuestion()},nextQuestion()</script></body></html>
