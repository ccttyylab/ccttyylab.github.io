<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CcttyyLab - 梦幻代码星系</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* 融合蓝、紫、橙的流光色彩 */
      --c-blue: #2563eb;
      --c-purple: #7c3aed;
      --c-orange: #f59e0b;
      --text-main: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.6);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #030014;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* 梦幻流光背景 */
    .gradient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
      filter: blur(80px);
      animation: drift 20s infinite alternate ease-in-out;
    }

    @keyframes drift {
      from {
        transform: scale(1) translate(0, 0);
      }

      to {
        transform: scale(1.1) translate(-2%, -2%);
      }
    }

    /* 动态网格点 */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.3;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 80px;
      animation: fadeIn 1.2s ease-out;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -3px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.4) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--c-purple);
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* 玻璃拟态网格 */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      perspective: 1000px;
    }

    .project-card {
      position: relative;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 40px;
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      min-height: 280px;
      /* 细腻的反光边缘 */
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    /* 浮空上浮反馈 */
    .project-card:hover {
      transform: translateY(-20px) scale(1.03);
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.25);
      /* 深远投影 */
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .card-icon {
      font-size: 3.5rem;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .project-card:hover .card-icon {
      transform: scale(1.1) translateY(-5px);
    }

    .card-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .card-desc {
      font-size: 1rem;
      color: var(--text-dim);
      line-height: 1.6;
    }

    /* 每一个卡片的个性化发光 */
    .project-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      opacity: 0;
      transition: opacity 0.6s;
      pointer-events: none;
      background: radial-gradient(circle at var(--px) var(--py), rgba(255, 255, 255, 0.15) 0%, transparent 50%);
    }

    .project-card:hover::after {
      opacity: 1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .container {
        padding: 60px 20px;
      }

      h1 {
        font-size: 3.5rem;
      }

      .project-card {
        padding: 32px;
        min-height: 240px;
      }
    }

    footer {
      text-align: center;
      padding: 80px 0;
      color: var(--text-dim);
      font-size: 0.8rem;
      letter-spacing: 3px;
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <div class="gradient-bg"></div>
  <canvas id="bg-canvas"></canvas>

  <div class="container">
    <header>
      <div class="subtitle">STELLAR HUB</div>
      <h1>CCTTYY LAB</h1>
      <p id="hero-subtitle" style="color: var(--text-dim); max-width: 600px; margin: 0 auto;">数字艺术与代码逻辑的交汇点</p>
    </header>

    <div id="project-grid" class="project-grid">
      <!-- JS 注入 -->
    </div>

    <footer>&copy; 2024 CCTTYY LAB. BEYOND THE LIMIT.</footer>
  </div>

  <script>
    const grid = document.getElementById('project-grid');

    async function init() {
      try {
        const res = await fetch('https://ccttyylab.github.io/projects.json');
        const data = await res.json();

        data.projects.forEach((proj, i) => {
          const card = document.createElement('a');
          card.href = proj.url;
          card.className = 'project-card';

          // 每一个卡片的个性化边框色（光晕暗示）
          const accentColor = proj.planetColor || '#7c3aed';
          card.style.borderBottom = `2px solid ${accentColor}33`; // 20% opacity

          card.innerHTML = `
                        <div class="card-icon">${proj.icon}</div>
                        <div class="card-body">
                            <div class="card-title">${proj.name}</div>
                            <div class="card-desc">${proj.desc}</div>
                        </div>
                    `;

          // 鼠标跟随发光逻辑
          card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            card.style.setProperty('--px', `${e.clientX - rect.left}px`);
            card.style.setProperty('--py', `${e.clientY - rect.top}px`);
          });

          grid.appendChild(card);
        });
      } catch (e) { console.error(e); }
    }

    // 星空粒子背景
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let w, h, particles = [];

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.s = Math.random() * 1.5;
        this.o = Math.random();
      }
      draw() {
        ctx.fillStyle = `rgba(255,255,255,${this.o * 0.3})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.s, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function animate() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => p.draw());
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    for (let i = 0; i < 150; i++) particles.push(new Particle());
    init();
    animate();
  </script>
</body>

</html>
